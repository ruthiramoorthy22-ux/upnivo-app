<style>

/* ===== v2: colourful + animated + picture cards ===== */
:root{--navy:#1e1b4b;--n2:#4338ca}
.hero{background:linear-gradient(135deg,#4338ca,#7c3aed 50%,#ec4899);box-shadow:0 14px 30px #7c3aed44}.hero:after{background:radial-gradient(circle,#fde68a88,transparent 68%);animation:flt 7s ease-in-out infinite}
@keyframes flt{50%{transform:translate(-26px,20px) scale(1.15)}}
.banner{background:linear-gradient(120deg,#f59e0b,#ef4444 55%,#ec4899);box-shadow:0 12px 26px #ef444442;animation:pop .6s}
.chip{transition:.2s}.chip:hover{transform:translateY(-2px)}.chip.on{background:linear-gradient(90deg,#7c3aed,#ec4899);border-color:transparent;box-shadow:0 6px 14px #7c3aed44}
.list{grid-template-columns:1fr 1fr;gap:12px;padding:12px}

@keyframes fu{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

@keyframes pls{50%{transform:scale(1.07)}}

.pbd{padding:11px 12px 13px}.pbd b{font-size:14px;line-height:1.3;display:block;min-height:36px}.pm{font-size:12px;color:var(--mu);margin-top:6px;font-weight:600}.pm2{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11px;color:#7c3aed;font-weight:700;margin-top:6px}
.dcov{width:100%;max-height:190px;object-fit:cover;border-radius:18px;margin:14px 0 4px;box-shadow:0 10px 24px #0004;animation:pop .6s}
.btn{background:linear-gradient(90deg,#4338ca,#7c3aed,#ec4899);background-size:200% 100%;box-shadow:0 8px 20px #7c3aed55}.btn:hover{background-position:100% 0}

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>UPNIVO Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#071433;--blue:#1a73e8;--bg:#f2f5fb;--line:#e3e9f5;--mu:#64748b;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box;margin:0;font-family:Inter,system-ui,sans-serif}body{background:var(--bg);color:#0f1b3d;min-height:100vh}
#r{display:flex;min-height:100vh}aside{width:230px;background:linear-gradient(180deg,#071433,#0d2260);color:#fff;padding:18px 14px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside img{width:100%;mix-blend-mode:screen;margin-bottom:10px}aside a{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-radius:12px;cursor:pointer;color:#a9c3f5;font-size:14px;font-weight:600}aside a:hover{background:#ffffff12}aside a.on{background:var(--blue);color:#fff}
.nb{background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.top h2{font-size:19px;font-weight:800}
main{padding:24px 26px;overflow:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}.c{background:#fff;border-radius:16px;padding:18px;border:1px solid var(--line)}.c b{font-size:30px;font-weight:800;color:var(--blue);display:block}.c span{font-size:12.5px;color:var(--mu);font-weight:600}.c.hot b{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.panel h3{font-size:15px;margin-bottom:12px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef2fa;font-size:13.5px}.li:last-child{border:0}.li small{color:var(--mu);display:block;font-size:12px}
.tw{background:#fff;border:1px solid var(--line);border-radius:16px;overflow-x:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:760px}th{background:#f7f9fe;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);text-align:left;padding:11px 14px}td{padding:12px 14px;border-top:1px solid #eef2fa;font-size:13.5px;vertical-align:top}td small{color:var(--mu);display:block;font-size:12px;margin-top:2px}
input,select,textarea{padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;width:100%;font-size:14px;outline:0;background:#fff}input:focus,select:focus,textarea:focus{border-color:var(--blue)}
button{padding:8px 14px;border:0;border-radius:9px;background:var(--blue);color:#fff;cursor:pointer;font-size:13px;font-weight:700;margin:2px}button.r{background:var(--bad)}button.g{background:var(--ok)}button.s{background:#eef3fd;color:var(--blue)}button:disabled{opacity:.5}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;background:#e0edff;color:var(--blue)}.t-Pending,.t-Rework{background:#fef3c7;color:#92400e}.t-Under{background:#dbeafe;color:#1d4ed8}.t-Approved,.t-Offer{background:#d1fae5;color:#047857}.t-Rejected{background:#fee2e2;color:#b91c1c}.t-Submitted{background:#dbeafe;color:#1d4ed8}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar input,.bar select{width:auto;min-width:200px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .full{grid-column:1/-1}
.mo{position:fixed;inset:0;background:#0007;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}.md{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:720px;max-height:90vh;overflow:auto}.md h3{font-size:18px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.kv div{background:#f7f9fe;border-radius:10px;padding:10px 12px;font-size:13.5px}.kv small{display:block;color:var(--mu);font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:2px}
.login{margin:auto;background:#fff;padding:30px;border-radius:20px;width:360px;max-width:92vw;box-shadow:0 10px 40px #0a1a3f22}.login img{width:100%;border-radius:14px}
.bell{position:relative;background:#eef3fd;color:var(--blue);width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:19px}.bell .nb{position:absolute;top:-5px;right:-5px}
.dd{position:absolute;right:26px;top:62px;width:380px;max-width:92vw;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px #0a1a3f33;z-index:40}.dd .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800}
.nt{padding:12px 16px;border-bottom:1px solid #eef2fa;cursor:pointer;font-size:13.5px}.nt.un{background:#eff6ff}.nt b{display:block}.nt p{color:var(--mu);font-size:12.5px;margin-top:2px}.nt small{color:#94a3b8;font-size:11px}
.toast{position:fixed;top:16px;right:16px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;font-size:14px;font-weight:600;box-shadow:0 8px 24px #0004}
.pb{height:6px;background:#e6edfb;border-radius:6px;min-width:80px;margin-top:4px}.pb i{display:block;height:100%;background:var(--ok);border-radius:6px}
a.lk{color:var(--blue);font-weight:600;word-break:break-all}
@media(max-width:800px){aside{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;z-index:30;padding:6px}aside img{display:none}aside a{flex:1;justify-content:center;font-size:11px;padding:9px 6px;white-space:nowrap;gap:4px}.wrap{padding-bottom:66px}.two,.f,.kv{grid-template-columns:1fr}main{padding:16px}.top{padding:12px 16px}}

/* ===== v2: colourful app look + animations ===== */
:root{--p1:#6d28d9;--p2:#2563eb;--p3:#0ea5e9;--pink:#ec4899;--org:#f59e0b}
body{background:linear-gradient(180deg,#eef2ff,#f6f9ff 40%,#fdf4ff)}
aside{background:linear-gradient(180deg,#1e1b4b,#312e81 45%,#6d28d9);box-shadow:6px 0 30px #312e8133}
aside a{transition:.2s;gap:10px;justify-content:flex-start}aside a span{flex:1}aside a i{font-style:normal;font-size:17px;width:24px;text-align:center}
aside a:hover{background:#ffffff1f;transform:translateX(4px)}aside a.on{background:linear-gradient(90deg,#ec4899,#f59e0b);box-shadow:0 8px 20px #ec489955}
.top{background:#ffffffd9;backdrop-filter:blur(10px)}.top h2{background:linear-gradient(90deg,var(--p1),var(--p3));-webkit-background-clip:text;background-clip:text;color:transparent}
main{animation:fup .45s ease both}@keyframes fup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero2{border-radius:22px;padding:24px 26px;margin-bottom:20px;color:#fff;background:linear-gradient(120deg,#6d28d9,#2563eb 55%,#0ea5e9);position:relative;overflow:hidden;box-shadow:0 16px 36px #4f46e544}
.hero2:after{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#ffffff44,transparent 70%);animation:flt 6s ease-in-out infinite}
.hero2 h3{font-size:22px;font-weight:800}.hero2 p{opacity:.9;font-size:14px;margin-top:4px}@keyframes flt{50%{transform:translate(-24px,18px) scale(1.12)}}
.cards{gap:16px}.c{position:relative;overflow:hidden;border:0;color:#fff;animation:fup .5s ease both;animation-delay:var(--d,0ms);transition:.25s;box-shadow:0 10px 24px #0a1a3f1f}.c:hover{transform:translateY(-6px) scale(1.02)}
.c b{color:#fff;font-size:32px}.c span{color:#ffffffd9}.c em{position:absolute;right:12px;top:8px;font-style:normal;font-size:34px;opacity:.28;animation:flt 5s ease-in-out infinite}
.k0{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.k1{background:linear-gradient(135deg,#0ea5e9,#2563eb)}.k2{background:linear-gradient(135deg,#f59e0b,#ef4444)}.k3{background:linear-gradient(135deg,#10b981,#14b8a6)}.k4{background:linear-gradient(135deg,#ec4899,#f43f5e)}.k5{background:linear-gradient(135deg,#8b5cf6,#d946ef)}.k6{background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.c.hot b{color:#fff}.c.hot:before{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 2px #ffffff88;animation:pls 2s infinite}@keyframes pls{50%{opacity:.2}}
.panel,.tw{border:0;box-shadow:0 8px 24px #4f46e514;animation:fup .5s ease both}.li{transition:.15s}.li:hover{background:#f5f3ff}
button{transition:.15s;background:linear-gradient(90deg,var(--p2),var(--p3));box-shadow:0 4px 10px #2563eb33}button:hover{transform:translateY(-2px);filter:brightness(1.07)}button:active{transform:scale(.96)}
button.s{background:#eef2ff;color:var(--p1);box-shadow:none}button.g{background:linear-gradient(90deg,#10b981,#14b8a6)}button.r{background:linear-gradient(90deg,#ef4444,#f43f5e)}
tr{transition:.15s}tr:hover td{background:#faf5ff}th{background:linear-gradient(90deg,#f5f3ff,#eff6ff)}
.mo{animation:fin .2s}.md{animation:pop2 .28s cubic-bezier(.2,1.3,.4,1)}@keyframes fin{from{opacity:0}}@keyframes pop2{from{opacity:0;transform:scale(.9) translateY(20px)}}
.toast{background:linear-gradient(90deg,#4f46e5,#ec4899);animation:fup .3s}
.nb{animation:pls 1.6s infinite}.bell:hover{animation:wig .5s}@keyframes wig{25%{transform:rotate(14deg)}75%{transform:rotate(-14deg)}}
/* domain cards with pictures */
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:16px}
.dc{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #4f46e51a;transition:.3s;animation:fup .55s ease both;animation-delay:var(--d,0ms);border:2px solid #fff}
.dc:hover{transform:translateY(-8px);box-shadow:0 20px 40px #4f46e533;border-color:#c4b5fd}
.dc .im{position:relative;height:150px;overflow:hidden;background:#e0e7ff}.dc .im img{width:100%;height:100%;object-fit:cover;transition:.5s}.dc:hover .im img{transform:scale(1.1)}
.dc .tp{position:absolute;top:10px;left:10px;background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;letter-spacing:.5px}
.dc .hid{position:absolute;top:10px;right:10px;background:#0f172acc;color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px}
.dc .bd{padding:14px 16px}.dc h4{font-size:15px;line-height:1.35;min-height:40px}.dc .en{font-size:12.5px;color:var(--mu);margin:6px 0 8px}.dc .bt{display:flex;flex-wrap:wrap;margin:6px -2px 0}
.addc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;border:3px dashed #c4b5fd;background:#faf5ff;color:var(--p1);font-weight:800;cursor:pointer;border-radius:20px;transition:.25s;animation:fup .5s ease both}.addc:hover{background:#f3e8ff;transform:scale(1.02)}.addc b{font-size:46px;line-height:1}
.mini{display:flex;gap:6px;margin:8px 0 0;flex-wrap:wrap}
.login{animation:pop2 .5s}#r:has(.login){background:radial-gradient(circle at 50% 20%,#4c1d95,#1e1b4b 70%)}
.cert-prev{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:2px solid #f5c842;border-radius:16px;padding:18px;text-align:center}
@media(max-width:800px){aside{background:linear-gradient(90deg,#1e1b4b,#6d28d9)}aside a i{font-size:19px}aside a span{display:none}aside a.on{transform:none}.dg{grid-template-columns:1fr 1fr;gap:12px}.dc .im{height:104px}}
@media(max-width:480px){.dg{grid-template-columns:1fr}}
.chs{display:flex;flex-wrap:wrap;gap:6px}.chp{display:inline-block;background:#eef2ff;color:#4338ca;font-weight:700;font-size:12.5px;padding:5px 11px;border-radius:20px;text-decoration:none;transition:.15s}.chp:hover{background:#4338ca;color:#fff;transform:translateY(-2px)}select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
</style></head><body><div id="r"></div><div id="dd"></div>
<script>
let tok=localStorage.atok||'',tab='Dashboard',ST={},unread=0,seen=0,S={};const R=document.getElementById('r');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdt=s=>s?new Date(s+'Z').toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const fd=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';
const ago=s=>{const m=(Date.now()-new Date(s+'Z'))/6e4;return m<1?'just now':m<60?Math.floor(m)+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'};
const slinks=x=>[[x.github,'🐙 GitHub'],[x.video,'🎬 Demo video'],[x.link,'🔗 Link']].filter(p=>url(p[0])).map(p=>`<a class="chp" target="_blank" rel="noopener" href="${esc(url(p[0]))}">${p[1]}</a>`).join('')||'<small>No links</small>';
const url=u=>/^https?:\/\//i.test(u||'')?u:'';const key=s=>s.split(' ')[0];
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401||r.status==403&&p!='/admin/login')out();throw new Error(typeof d.detail=='string'?d.detail:'Error')}return d}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3000)}
function modal(h){closeM();const e=document.createElement('div');e.className='mo';e.innerHTML=`<div class="md">${h}</div>`;e.onclick=v=>{if(v.target==e)e.remove()};document.body.append(e)}
const closeM=()=>document.querySelectorAll('.mo').forEach(e=>e.remove());
function pick(max,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.88))};im.src=r.result};r.readAsDataURL(f)};i.click()}
function out(){tok='';localStorage.atok='';draw()}
const TABS=['Dashboard','Students','Enrollments','Offer Letter','Certificate','Internships','Submissions','Announce','Payments','Settings'],TL={Announce:'Send Message',Internships:'Domains & Tasks',Settings:'Payment Details','Offer Letter':'Offer Letter Model',Certificate:'Certificate Model'},TI2={Announce:'📣',Dashboard:'📊',Students:'🎓',Enrollments:'📝','Offer Letter':'✉️',Certificate:'🏅',Internships:'🧩',Submissions:'✅',Payments:'💳',Settings:'⚙️'};
function draw(){if(!tok)return R.innerHTML=`<div class="login"><img src="/static/logo.png" style="mix-blend-mode:multiply"><h2 style="margin:14px 0 6px">Admin Login</h2><input id="e" placeholder="Admin email" style="margin-bottom:10px"><input id="p" type="password" placeholder="Password" onkeydown="event.key=='Enter'&&lg()"><p id="er" style="color:var(--bad);margin:8px 0;font-size:13px"></p><button style="width:100%;padding:13px;margin:0" onclick="lg()">Secure Login</button><p style="font-size:12px;color:var(--mu);margin-top:12px">Forgot password: reset via server admin (email service not configured)</p></div>`;
R.innerHTML=`<aside><img src="/static/logo.png">${TABS.map(t=>`<a class="${t==tab?'on':''}" onclick="tab='${t}';draw()"><i>${TI2[t]}</i><span>${TL[t]||t}</span><em class="nb" id="b_${t}" hidden></em></a>`).join('')}<a style="margin-top:auto" onclick="out()">Logout</a></aside><div class="wrap"><div class="top"><h2>${TL[tab]||tab}</h2><div class="bell" onclick="toggleDD()">🔔<em class="nb" id="bn" hidden></em></div></div><main id="m">Loading…</main></div>`;view();poll();api('/admin/stats').then(badges).catch(()=>{})}
async function lg(){try{const d=await api('/admin/login','POST',{email:$('#e').value,password:$('#p').value});tok=d.token;localStorage.atok=tok;draw()}catch(x){$('#er').textContent=x.message}}
function badges(s){const set=(t,n)=>{const e=$('#b_'+t);if(e){e.textContent=n;e.hidden=!n}};set('Enrollments',s.pending);set('Submissions',s.to_review);set('Payments',s.payments)}
async function view(){const m=$('#m');try{
if(tab=='Dashboard'){const s=await api('/admin/stats');badges(s);const C=[['students','Registered students'],['enrollments','Total enrollments'],['pending','Waiting for offer letter','hot'],['offers','Offer letters sent'],['to_review','Submissions to review','hot'],['payments','Payments to verify','hot'],['internships','Internships']];
const CI=['🎓','📝','⏳','✉️','✅','💳','🧩'];m.innerHTML=`<div class="hero2"><h3>Welcome back, Admin 👋</h3><p>${s.pending?`${s.pending} enrollment(s) are waiting for an offer letter.`:'All enrollments are handled. Great job!'} ${s.to_review?`${s.to_review} task submission(s) need review.`:''}</p></div><div class="cards">${C.map(([k,l,h],n)=>`<div class="c k${n} ${h||''}" style="--d:${n*70}ms"><em>${CI[n]}</em><b data-n="${s[k]}">0</b><span>${l}</span></div>`).join('')}</div><div class="two"><div class="panel"><h3>Recent enrollments</h3>${s.recent_apps.map(a=>`<div class="li"><div>${esc(a.student)}<small>${esc(a.title)} · ${esc(a.college)}</small></div><div style="text-align:right"><span class="tag t-${key(a.status)}">${a.status}</span>${a.status!='Offer Sent'&&a.status!='Rejected'?`<br><button class="g" onclick="offerM(${a.id})">Send offer letter</button>`:''}</div></div>`).join('')||'<small>No enrollments yet</small>'}<button class="s" onclick="tab='Enrollments';draw()">View all →</button></div>
<div class="panel"><h3>Recently registered students</h3>${s.recent_students.map(u=>`<div class="li"><div>${esc(u.name)}<small>${esc(u.college)} · ${esc(u.email)}</small></div><small>${ago(u.created)}</small></div>`).join('')||'<small>No students yet</small>'}<button class="s" onclick="tab='Students';draw()">View all →</button></div></div>`;countUp()}
if(tab=='Students'){S.st=await api('/admin/students');m.innerHTML=`<div class="bar"><input id="q" placeholder="Search name, email, college, mobile" oninput="stTable()"><b style="color:var(--mu);font-size:13px">${S.st.length} students</b></div><div class="tw" id="tb"></div>`;stTable()}
if(tab=='Enrollments'){S.ap=await api('/admin/applications');m.innerHTML=`<div class="bar"><select id="fs" onchange="apTable()"><option value="">All statuses</option>${['Pending','Under Review','Approved','Offer Sent','Rejected'].map(x=>`<option>${x}</option>`).join('')}</select><input id="q" placeholder="Search student or internship" oninput="apTable()"></div><div class="tw" id="tb"></div>`;apTable()}
if(tab=='Submissions'){m.innerHTML=`<div class="bar"><select id="fs" onchange="subLoad()"><option value="Submitted">Waiting for review</option><option value="Rework">Sent back for rework</option><option value="Approved">Approved</option><option value="">All</option></select></div><div class="tw" id="tb"></div>`;subLoad()}
if(tab=='Payments'){const l=await api('/admin/payments');S.pay=l;m.innerHTML=`<div class="tw"><table><tr><th>Student<th>Internship<th>Amount<th>UTR / Transaction no.<th>When<th>Status<th></tr>${l.map(p=>`<tr><td><b>${esc(p.student)}</b><small>${esc(p.email)}</small><td>${esc(p.internship)}<small>${p.months} month plan</small><td>₹${p.amount}<td><b>${esc(p.utr)}</b><td>${ago(p.created)}<td><span class="tag t-${p.status=='Paid'?'Approved':p.status=='Rejected'?'Rejected':'Pending'}">${p.status}</span>${p.note?`<small>${esc(p.note)}</small>`:''}<td>${p.status=='Pending'?`<button class="g" onclick="payRv(${p.id},'Paid')">Verify & unlock</button><button class="r" onclick="payRv(${p.id},'Rejected')">Reject</button>`:''}</tr>`).join('')||'<tr><td colspan=7>No payments yet'}</table></div><p style="font-size:13px;color:var(--mu);margin-top:10px">Check the UTR number in your UPI app / bank statement before verifying.</p>`}
if(tab=='Offer Letter'){const c=await api('/admin/settings');SG=c.signature;m.innerHTML=`<div class="two"><div class="panel"><h3>Offer letter wording</h3><p style="font-size:13px;color:var(--mu);margin-bottom:10px">This text is used for every new offer letter. You can use <b>{name}</b>, <b>{internship}</b>, <b>{plan}</b> and <b>{start}</b>. Letters already sent keep the wording they were sent with.</p>
<small style="font-weight:700">Opening paragraph</small><textarea id="ol_intro" rows="4" style="margin:5px 0 10px">${esc(c.offer_intro)}</textarea><small style="font-weight:700">Terms (one per line)</small><textarea id="ol_terms" rows="4" style="margin:5px 0 10px">${esc(c.offer_terms)}</textarea>

<div><small style="font-weight:700">Plans (months)</small><div style="padding:10px 0">${[1,2,3].map(m=>`<label style="margin-right:14px"><input type="checkbox" class="pc" value="${m}" ${ps.includes(String(m))?'checked':''} style="width:auto"> ${m}</label>`).join('')}</div></div>
${IT.map(([k,l])=>`<div class="full"><small style="font-weight:700">${l}</small><textarea id="i_${k}" rows="${k=='description'?3:2}">${esc(i[k]||'')}</textarea></div>`).join('')}</div>
<div style="text-align:right;margin-top:12px"><button class="s" onclick="closeM()">Cancel</button><button onclick="intSave(${id||0})">Save</button></div>`)}
function dpick(){pick(1000,async d=>{try{DI=(await api('/upload','POST',{data:d})).url;$('#dip').innerHTML=`<img src="${esc(DI)}" style="width:100%;max-height:150px;object-fit:cover;border-radius:12px">`}catch(e){toast(e.message)}})}
async function intSave(id){const b=id?{...S.it.find(x=>x.id==id)}:{published:true};[...IF,...IT,['mode']].forEach(([k])=>b[k]=$('#i_'+k).value);b.image=DI;b.plans=[...document.querySelectorAll('.pc:checked')].map(x=>x.value).join(',')||'1';b.duration=b.plans.split(',').join(' / ')+' months';
try{await api(id?'/admin/internships/'+id:'/admin/internships',id?'PUT':'POST',b);closeM();toast('Saved ✔');view()}catch(e){toast(e.message)}}
async function tg(id){const i=S.it.find(x=>x.id==id);i.published=!i.published;await api('/admin/internships/'+id,'PUT',i);view()}
async function del(id){if(confirm('Delete this internship, its tasks and all enrollments?')){await api('/admin/internships/'+id,'DELETE');view()}}
// tasks manager
let TM={iid:0,m:1,list:[]};
async function tasksM(id,m){const it=S.it.find(x=>x.id==id),ps=it.plans.split(',').map(Number);const same=TM.iid==id;TM.iid=id;TM.m=m||(same&&ps.includes(TM.m)?TM.m:ps[0]);
TM.list=await api(`/admin/internships/${id}/tasks?months=${TM.m}`);
modal(`<h3>${esc(it.title)} · tasks</h3><div class="bar" style="margin-bottom:8px">${ps.map(p=>`<button class="${p==TM.m?'':'s'}" onclick="tasksM(${id},${p})">${p} month</button>`).join('')}<b style="color:var(--mu);font-size:13px">${TM.list.length} tasks · students do them in this order</b></div>
<div style="max-height:50vh;overflow:auto">${TM.list.map((t,k)=>`<div class="li"><div><b>Day ${t.day}</b> · ${esc(t.title)}${t.image?' 🖼':''}${t.brief?' 📝':''}<small>${esc(t.theme)} · Submit: ${esc(t.submit)}</small></div><div style="white-space:nowrap"><button class="s" onclick="mv(${t.id},'up')" ${k?'':'disabled'}>↑</button><button class="s" onclick="mv(${t.id},'down')" ${k<TM.list.length-1?'':'disabled'}>↓</button><button class="s" onclick="taskM(${t.id})">Edit</button><button class="r" onclick="tdel(${t.id})">✕</button></div></div>`).join('')||'<small>No tasks in this plan yet</small>'}</div>
<div style="text-align:right;margin-top:12px"><button class="s" onclick="closeM();view()">Close</button><button onclick="taskM(0)">+ Add task</button></div>`)}
const mv=async(t,d)=>{await api(`/admin/tasks/${t}/move?dir=${d}`,'POST');tasksM(TM.iid,TM.m)};
let TI='';
function taskM(id){const t=id?TM.list.find(x=>x.id==id):{title:'',submit:'',brief:'',theme:(TM.list.at(-1)||{}).theme||'',image:'',resource:''};TI=t.image||'';
modal(`<h3>${id?'Edit':'Add'} task</h3><div class="f"><div class="full"><small style="font-weight:700">Task (what the student must do — write it simply)</small><textarea id="t_title" rows="2">${esc(t.title)}</textarea></div><div class="full"><small style="font-weight:700">What to submit</small><input id="t_submit" value="${esc(t.submit)}"></div>
<div class="full"><small style="font-weight:700">Detailed explanation / steps (optional)</small><textarea id="t_brief" rows="5">${esc(t.brief)}</textarea></div><div><small style="font-weight:700">Week title</small><input id="t_theme" value="${esc(t.theme)}"></div><div><small style="font-weight:700">Study material link (optional)</small><input id="t_res" placeholder="https://" value="${esc(t.resource)}"></div>
<div class="full"><small style="font-weight:700">Task image (optional)</small><div id="tip">${TI?`<img src="${esc(TI)}" style="max-width:100%;max-height:180px;border-radius:10px;display:block;margin:6px 0">`:''}</div><button class="s" onclick="tpick()">Upload image</button><button class="s" onclick="TI='';$('#tip').innerHTML=''">Remove image</button></div></div>
<div style="text-align:right;margin-top:12px"><button class="s" onclick="tasksM(${TM.iid},${TM.m})">Back</button><button onclick="tsave(${id})">Save task</button></div>`)}
function tpick(){pick(1400,async d=>{try{TI=(await api('/upload','POST',{data:d})).url;$('#tip').innerHTML=`<img src="${esc(TI)}" style="max-width:100%;max-height:180px;border-radius:10px;display:block;margin:6px 0">`}catch(e){toast(e.message)}})}
async function tsave(id){const b={title:$('#t_title').value,submit:$('#t_submit').value,brief:$('#t_brief').value,theme:$('#t_theme').value,resource:$('#t_res').value,image:TI,months:TM.m};if(!b.title.trim())return toast('Task text is required');
try{await api(id?'/admin/tasks/'+id:`/admin/internships/${TM.iid}/tasks`,id?'PUT':'POST',b);toast('Saved ✔');tasksM(TM.iid,TM.m)}catch(e){toast(e.message)}}
async function tdel(t){if(confirm('Remove this task? Later days shift up by one.')){await api('/admin/tasks/'+t,'DELETE');tasksM(TM.iid,TM.m)}}
// students edit, payments, settings
const SF=[['name','Name'],['mobile','Mobile'],['college','College'],['degree','Degree'],['department','Department'],['year','Year'],['city','City'],['state','State'],['country','Country'],['gender','Gender']];
async function stEdit(id){const u=(await api('/admin/students/'+id)).user;modal(`<h3>Edit student</h3><p style="font-size:13px;color:var(--mu);margin-bottom:10px">${esc(u.email)}</p><div class="f">${SF.map(([k,l])=>`<div><small style="font-weight:700">${l}</small><input id="s_${k}" value="${esc(u[k]||'')}"></div>`).join('')}<div class="full"><small style="font-weight:700">About</small><textarea id="s_about" rows="3">${esc(u.about||'')}</textarea></div></div><div style="text-align:right;margin-top:12px"><button class="s" onclick="closeM()">Cancel</button><button onclick="stSave(${id})">Save</button></div>`)}
async function stSave(id){const b={about:$('#s_about').value};SF.forEach(([k])=>b[k]=$('#s_'+k).value);try{await api('/admin/students/'+id,'PUT',b);closeM();toast('Saved ✔');view()}catch(e){toast(e.message)}}
async function payRv(id,st){const n=st=='Rejected'?prompt('Reason for the student (optional)')??'':'';await api('/admin/payments/'+id,'PUT',{status:st,note:n});toast(st=='Paid'?'Certificate unlocked ✔':'Rejected');view()}
async function saveSet(){try{await api('/admin/settings','PUT',{cert_fee:$('#cf').value||'0',upi_id:$('#ui').value.trim(),upi_name:$('#un').value.trim()});toast('Settings saved ✔')}catch(e){toast(e.message)}}
// notifications
let notes=[];function toggleDD(){const e=$('#dd');if(e.innerHTML){e.innerHTML='';return}drawDD()}
async function drawDD(){const d=await api('/notifications');notes=d.items;$('#dd').innerHTML=`<div class="dd"><div class="hd">Notifications<button class="s" onclick="readAll()">Mark all read</button></div>${notes.map(n=>`<div class="nt ${n.read?'':'un'}" onclick="openN('${esc(n.link)}')"><b>${esc(n.title)}</b><p>${esc(n.body)}</p><small>${ago(n.created)}</small></div>`).join('')||'<div class="nt"><p>No notifications yet</p></div>'}</div>`}
function openN(l){$('#dd').innerHTML='';tab={students:'Students',enrollments:'Enrollments',payments:'Payments',submissions:'Submissions'}[l]||tab;draw()}
async function readAll(){await api('/notifications/read','POST');unread=0;seen=0;setBell();drawDD()}
function setBell(){const b=$('#bn');if(b){b.textContent=unread;b.hidden=!unread}}
async function poll(){if(!tok)return;try{const d=await api('/notifications');if(d.unread>seen&&seen>=0&&window.pl&&d.items[0]){toast('🔔 '+d.items[0].title+' — '+d.items[0].body);if(['Dashboard','Enrollments','Students','Payments','Submissions'].includes(tab)&&!document.querySelector('.mo'))view()}seen=unread=d.unread;window.pl=1;setBell()}catch(e){}}
setInterval(poll,20000);draw()
</script><script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').then(r=>{const show=w=>{if(document.querySelector('.upd'))return;const d=document.createElement('div');d.className='upd';d.innerHTML='<span>🆕</span><b>A new update is available</b><button>Update now</button>';d.querySelector('button').onclick=()=>w.postMessage({type:'SKIP'});document.body.append(d)};if(r.waiting&&navigator.serviceWorker.controller)show(r.waiting);r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w)})});setInterval(()=>r.update().catch(()=>{}),600000)}).catch(()=>{}));let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl){rl=1;location.reload()}})}</script></body></html>
